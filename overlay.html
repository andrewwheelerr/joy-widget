<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    background: transparent;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const { ipcRenderer } = require('electron');

const params = new URLSearchParams(window.location.search);
const ORIGIN_X = parseFloat(params.get('ox') || window.innerWidth / 2);
const ORIGIN_Y = parseFloat(params.get('oy') || window.innerHeight / 2);

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

const COLORS = [
  '#534AB7','#7B73E8','#1D9E75','#34C88A',
  '#D85A30','#F07A50','#D4537E','#F080A8',
  '#378ADD','#60A8F0','#BA7517','#F0A030',
  '#E24B4A','#FF7070','#639922','#90D030',
  '#111111','#555555'
];

class Piece {
  constructor() {
    this.x = Math.random() * W;
    this.y = -20 - Math.random() * H * 0.5;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = 3 + Math.random() * 6;
    this.gravity = 0.08 + Math.random() * 0.08;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.w = 6 + Math.random() * 10;
    this.h = this.w * (0.3 + Math.random() * 0.5);
    this.rot = Math.random() * Math.PI * 2;
    this.rotV = (Math.random() - 0.5) * 0.25;
    this.life = 1;
    this.decay = 0.003 + Math.random() * 0.005;
    this.shape = Math.random() > 0.4 ? 'rect' : 'circle';
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.08 + Math.random() * 0.08;
  }
  update() {
    this.vy += this.gravity;
    this.wobble += this.wobbleSpeed;
    this.x += this.vx + Math.sin(this.wobble) * 0.8;
    this.y += this.vy;
    this.rot += this.rotV;
    this.life -= this.decay;
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    if (this.shape === 'circle') {
      ctx.beginPath();
      ctx.ellipse(0, 0, this.w / 2, this.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
    }
    ctx.restore();
  }
}

class Bubble {
  constructor(ox, oy) {
    this.r = 18 + Math.random() * 38;
    this.x = ox + (Math.random() - 0.5) * 60;
    this.y = oy + (Math.random() - 0.5) * 20;
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.9;
    const speed = 1.2 + Math.random() * 2.8;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.02 + Math.random() * 0.03;
    this.hue = Math.random() * 360;
    this.life = 1;
    this.decay = 0.0018 + Math.random() * 0.0025;
  }
  update() {
    this.vy += 0.012;
    this.wobble += this.wobbleSpeed;
    this.x += this.vx + Math.sin(this.wobble) * 0.5;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw() {
    if (this.life <= 0) return;
    const alpha = Math.max(0, this.life);
    ctx.save();

    // iridescent rim
    const rim = ctx.createRadialGradient(this.x, this.y, this.r * 0.7, this.x, this.y, this.r);
    rim.addColorStop(0, `hsla(${this.hue}, 80%, 70%, 0)`);
    rim.addColorStop(0.6, `hsla(${this.hue + 40}, 90%, 75%, ${alpha * 0.25})`);
    rim.addColorStop(1, `hsla(${this.hue + 80}, 95%, 80%, ${alpha * 0.55})`);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = rim;
    ctx.fill();

    // transparent interior
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * 0.96, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue + 160}, 60%, 90%, ${alpha * 0.06})`;
    ctx.fill();

    // main glint top-left
    const glint = ctx.createRadialGradient(
      this.x - this.r * 0.35, this.y - this.r * 0.35, 0,
      this.x - this.r * 0.35, this.y - this.r * 0.35, this.r * 0.45
    );
    glint.addColorStop(0, `rgba(255,255,255,${alpha * 0.75})`);
    glint.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = glint;
    ctx.fill();

    // small secondary glint bottom-right
    ctx.beginPath();
    ctx.arc(this.x + this.r * 0.3, this.y + this.r * 0.35, this.r * 0.1, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha * 0.35})`;
    ctx.fill();

    ctx.restore();
  }
}

let pieces = [];
let animating = false;

function spawnBurst(ox, oy) {
  if (Math.random() < 0.4) {
    for (let i = 0; i < 55; i++) pieces.push(new Bubble(ox, oy));
  } else {
    for (let i = 0; i < 300; i++) pieces.push(new Piece());
  }
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  pieces = pieces.filter(p => p.life > 0);
  pieces.forEach(p => { p.update(); p.draw(); });
  if (pieces.length > 0) {
    requestAnimationFrame(loop);
  } else {
    animating = false;
    ipcRenderer.send('overlay-done');
  }
}

ipcRenderer.on('burst', (e, { ox, oy }) => {
  spawnBurst(ox, oy);
  if (!animating) {
    animating = true;
    loop();
  }
});

spawnBurst(ORIGIN_X, ORIGIN_Y);
animating = true;
loop();
</script>
</body>
</html>
