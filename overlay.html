<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    background: transparent;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const { ipcRenderer } = require('electron');

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

const COLORS = [
  '#534AB7','#7B73E8','#1D9E75','#34C88A',
  '#D85A30','#F07A50','#D4537E','#F080A8',
  '#378ADD','#60A8F0','#BA7517','#F0A030',
  '#E24B4A','#FF7070','#639922','#90D030',
  '#111111','#555555'
];

class Piece {
  constructor() {
    this.x = Math.random() * W;
    this.y = -20 - Math.random() * H * 0.5;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = 3 + Math.random() * 6;
    this.gravity = 0.08 + Math.random() * 0.08;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.w = 6 + Math.random() * 10;
    this.h = this.w * (0.3 + Math.random() * 0.5);
    this.rot = Math.random() * Math.PI * 2;
    this.rotV = (Math.random() - 0.5) * 0.25;
    this.life = 1;
    this.decay = 0.003 + Math.random() * 0.005;
    this.shape = Math.random() > 0.4 ? 'rect' : 'circle';
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.08 + Math.random() * 0.08;
  }
  update() {
    this.vy += this.gravity;
    this.wobble += this.wobbleSpeed;
    this.x += this.vx + Math.sin(this.wobble) * 0.8;
    this.y += this.vy;
    this.rot += this.rotV;
    this.life -= this.decay;
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    if (this.shape === 'circle') {
      ctx.beginPath();
      ctx.ellipse(0, 0, this.w / 2, this.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
    }
    ctx.restore();
  }
}

let pieces = [];
for (let i = 0; i < 300; i++) pieces.push(new Piece());

function loop() {
  ctx.clearRect(0, 0, W, H);
  pieces = pieces.filter(p => p.life > 0);
  pieces.forEach(p => { p.update(); p.draw(); });
  if (pieces.length > 0) {
    requestAnimationFrame(loop);
  } else {
    ipcRenderer.send('overlay-done');
  }
}

loop();
</script>
</body>
</html>
