<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Joy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: linear-gradient(135deg, #e8e8f0 0%, #f0ede8 50%, #e8f0e8 100%);
  }

  #drag-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 28px;
    -webkit-app-region: drag; z-index: 100;
  }

  #scene {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    position: relative; overflow: hidden;
    user-select: none;
  }

  #joy-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(140px, 38vw, 280px);
    font-weight: 700;
    letter-spacing: -0.05em;
    color: #111;
    pointer-events: none;
    z-index: 20;
    opacity: 0;
    white-space: nowrap;
    text-shadow: 0 2px 40px rgba(0,0,0,0.12);
  }

  #joy-btn {
    position: relative; z-index: 10;
    padding: 18px 48px;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: rgba(0,0,0,0.65);
    background: rgba(255,255,255,0.25);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 0.5px solid rgba(255,255,255,0.55);
    border-radius: 100px;
    cursor: pointer;
    outline: none;
    -webkit-app-region: no-drag;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.08),
      0 1px 3px rgba(0,0,0,0.06),
      inset 0 1px 0 rgba(255,255,255,0.9),
      inset 0 -1px 0 rgba(0,0,0,0.04);
    transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  #joy-btn:hover {
    background: rgba(255,255,255,0.35);
    box-shadow:
      0 4px 20px rgba(0,0,0,0.1),
      0 1px 4px rgba(0,0,0,0.07),
      inset 0 1px 0 rgba(255,255,255,0.95),
      inset 0 -1px 0 rgba(0,0,0,0.04);
    transform: scale(1.04);
  }

  #joy-btn:active, #joy-btn.firing {
    transform: scale(0.93);
    background: rgba(255,255,255,0.15);
  }

  /* Now playing pill */
  #now-playing {
    position: relative; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 16px;
    background: rgba(255,255,255,0.2);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 0.5px solid rgba(255,255,255,0.5);
    border-radius: 100px;
    font-size: 12px;
    color: rgba(0,0,0,0.55);
    letter-spacing: 0.01em;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    max-width: 280px;
    overflow: hidden;
  }

  #now-playing.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #np-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #1DB954;
    flex-shrink: 0;
    animation: pulse-dot 1.2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  #np-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #confetti-canvas {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 30;
  }
</style>
</head>
<body>
<div id="drag-bar"></div>
<div id="scene">
  <canvas id="confetti-canvas"></canvas>
  <div id="joy-text">JOY</div>
  <button id="joy-btn">bring me joy</button>
  <div id="now-playing">
    <div id="np-dot"></div>
    <span id="np-text">loading...</span>
  </div>
</div>
<script>
// ---- Config ----
const TRACKS = [
  { name: "Pete's Bar Shines", artists: [{ name: '' }], preview_url: "/audio/Pete's Bar Shines (1.50x).mp3" }
];

// ---- Elements ----
const btn = document.getElementById('joy-btn');
const joy = document.getElementById('joy-text');
const scene = document.getElementById('scene');
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
const nowPlaying = document.getElementById('now-playing');
const npText = document.getElementById('np-text');

let W, H, pieces = [], animating = false, rafId;
let tracks = TRACKS, currentAudio = null, fadeTimer = null;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

function pickRandomTrack() {
  if (!tracks.length) return null;
  return tracks[Math.floor(Math.random() * tracks.length)];
}

function stopCurrent() {
  if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.src = '';
    currentAudio = null;
  }
  nowPlaying.classList.remove('visible');
}

function playTrack(track) {
  stopCurrent();
  const audio = new Audio(track.preview_url);
  audio.volume = 0;
  currentAudio = audio;

  const artistName = track.artists.map(a => a.name).join(', ');
  npText.textContent = `${track.name} — ${artistName}`;
  nowPlaying.classList.add('visible');

  audio.play().catch(e => console.error('Playback error:', e));

  // Fade in
  let vol = 0;
  const fadeIn = setInterval(() => {
    vol = Math.min(1, vol + 0.05);
    if (currentAudio) currentAudio.volume = vol;
    if (vol >= 1) clearInterval(fadeIn);
  }, 50);

  // Fade out after 14s (preview is 30s)
  const PLAY_DURATION = 14000;
  const FADE_DURATION = 2000;

  fadeTimer = setTimeout(() => {
    let v = 1;
    const fadeOut = setInterval(() => {
      v = Math.max(0, v - 0.04);
      if (currentAudio) currentAudio.volume = v;
      if (v <= 0) {
        clearInterval(fadeOut);
        stopCurrent();
      }
    }, 50);
  }, PLAY_DURATION);
}

// ---- Confetti ----
const COLORS = [
  '#534AB7','#7B73E8','#1D9E75','#34C88A',
  '#D85A30','#F07A50','#D4537E','#F080A8',
  '#378ADD','#60A8F0','#BA7517','#F0A030',
  '#E24B4A','#FF7070','#639922','#90D030',
  '#111111','#555555'
];

class Piece {
  constructor() {
    this.x = Math.random() * W;
    this.y = -20 - Math.random() * H * 0.5;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = 3 + Math.random() * 6;
    this.gravity = 0.08 + Math.random() * 0.08;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.w = 6 + Math.random() * 10;
    this.h = this.w * (0.3 + Math.random() * 0.5);
    this.rot = Math.random() * Math.PI * 2;
    this.rotV = (Math.random() - 0.5) * 0.25;
    this.life = 1;
    this.decay = 0.003 + Math.random() * 0.005;
    this.shape = Math.random() > 0.4 ? 'rect' : 'circle';
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.08 + Math.random() * 0.08;
  }
  update() {
    this.vy += this.gravity;
    this.wobble += this.wobbleSpeed;
    this.x += this.vx + Math.sin(this.wobble) * 0.8;
    this.y += this.vy;
    this.rot += this.rotV;
    this.life -= this.decay;
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    if (this.shape === 'circle') {
      ctx.beginPath();
      ctx.ellipse(0, 0, this.w / 2, this.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
    }
    ctx.restore();
  }
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  pieces = pieces.filter(p => p.life > 0);
  pieces.forEach(p => { p.update(); p.draw(); });
  if (pieces.length > 0) rafId = requestAnimationFrame(loop);
}

function burst() {
  for (let i = 0; i < 300; i++) pieces.push(new Piece());
  cancelAnimationFrame(rafId);
  loop();
}

// ---- JOY animation ----
function fireJoy() {
  joy.style.transition = 'none';
  joy.style.transform = 'translate(-50%,-50%) scale(0)';
  joy.style.opacity = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    joy.style.transition = 'transform 0.35s cubic-bezier(0.2,1.65,0.4,1), opacity 0.12s ease';
    joy.style.transform = 'translate(-50%,-50%) scale(1)';
    joy.style.opacity = '1';
  }));
  setTimeout(() => {
    joy.style.transition = 'transform 0.5s cubic-bezier(0.7,0,1,0.5), opacity 0.3s ease 0.15s';
    joy.style.transform = 'translate(-50%,-50%) scale(2.8)';
    joy.style.opacity = '0';
  }, 560);
  setTimeout(() => { animating = false; }, 1150);
}

// ---- Main trigger ----
btn.addEventListener('click', () => {
  if (animating) return;
  animating = true;
  btn.classList.add('firing');
  setTimeout(() => btn.classList.remove('firing'), 160);

  burst();
  fireJoy();

  const track = pickRandomTrack();
  if (track) playTrack(track);
});
</script>
</body>
</html>
